name: Release

on:
  workflow_dispatch:
    inputs:
      exact_version:
        description: "Publish an exact version, for example 0.1.0"
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Validate npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org/

      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ inputs.exact_version }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "exact_version must be a stable semver version like 0.1.0" >&2
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$RELEASE_VERSION" ]; then
            npm version "$RELEASE_VERSION" --no-git-tag-version
          fi

      - name: Publish to npm
        env:
          RELEASE_VERSION: ${{ inputs.exact_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@humanbased-ai/jazzband@${RELEASE_VERSION}" version 2>/dev/null | grep -qF "${RELEASE_VERSION}"; then
            echo "Version ${RELEASE_VERSION} already on npm - skipping publish."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Push release tag
        env:
          RELEASE_TAG: v${{ inputs.exact_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
